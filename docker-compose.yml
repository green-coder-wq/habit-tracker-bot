version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: habit_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-habit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-habit_password}
      POSTGRES_DB: ${POSTGRES_DB:-habit_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habit_user} -d ${POSTGRES_DB:-habit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: habit_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  bot:
    build: .
    container_name: habit_bot
    env_file:
      - .env
    depends_on:
      - api
    command: python -m bot.main

  scheduler:
    build: .
    container_name: habit_scheduler
    env_file:
      - .env
    depends_on:
      - api
    command: python -m app.scheduler.notifier

volumes:
  postgres_data:
